name: Android runtime inspection

on:
  workflow_dispatch:
  push:
    branches: [codex/cloud-runtime]
    paths:
      - .github/workflows/android-runtime.yml
      - scripts/cloud-runtime.py

permissions:
  contents: read

concurrency:
  group: bybus-android-runtime
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'gravere/BYBUS' && github.event.repository.private == false
    # GitHub exposes draft releases only to credentials with push access.
    # The inspection script uses GET requests only; checkout never persists this token.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: android11
            image: system-images;android-30;google_apis;x86_64
          - profile: experimental16k
            image: system-images;android-35;google_apis_ps16k;x86_64
    env:
      RUNTIME_PROFILE: ${{ matrix.profile }}
      ANDROID_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare isolated Android environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-output
          trap 'printf "Environment setup failed at line %s\n" "$LINENO" > runtime-output/setup-error.txt' ERR
          test -e /dev/kvm
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          sdk_bin="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ ! -x "$sdk_bin/sdkmanager" ]; then
            for sdk_candidate in "$ANDROID_HOME"/cmdline-tools/*/bin; do
              if [ -x "$sdk_candidate/sdkmanager" ]; then sdk_bin="$sdk_candidate"; fi
            done
          fi
          test -x "$sdk_bin/sdkmanager"
          export PATH="$sdk_bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          printf '%s\n' "$sdk_bin" "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/bybus-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          sdkmanager --install emulator "$ANDROID_IMAGE"
          printf 'no\n' | avdmanager create avd -n bybus-runtime -k "$ANDROID_IMAGE"
          printf '\nhw.lcd.width=720\nhw.lcd.height=1560\nhw.lcd.density=320\n' >> "$ANDROID_AVD_HOME/bybus-runtime.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -accel-check > runtime-output/acceleration.txt
          "$ANDROID_HOME/emulator/emulator" -avd bybus-runtime -accel on -memory 3072 -cores 2 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none > "$RUNNER_TEMP/bybus-emulator.log" 2>&1 &
      - name: Inspect the published APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNTIME_CANDIDATE: ${{ github.event_name == 'push' }}
        run: python3 scripts/cloud-runtime.py
      - name: Save runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bybus-runtime-${{ matrix.profile }}
          path: runtime-output/
          retention-days: 1
          if-no-files-found: error
