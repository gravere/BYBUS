name: Android runtime inspection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspection scope
        type: choice
        options: [ui, launch, install-open, install-open-legacy, button-ui, button-feedback, detail-rest, row-feedback, service-callback, service-callback-new, service-cache, permissions, permissions-legacy, package-queries, updates, repairs, resources, migration-ui, interaction-ui, disclosure-ui, runtime]
        default: ui
      candidate:
        description: Inspect the staged release matching this branch
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: bybus-android-runtime
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'gravere/BYBUS' && github.event.repository.private == false
    # GitHub exposes draft releases only to credentials with push access.
    # The inspection script uses GET requests only; checkout never persists this token.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON((inputs.mode == 'permissions-legacy' || inputs.mode == 'install-open-legacy') && '["android11"]' || (inputs.mode == 'permissions' || inputs.mode == 'package-queries' || inputs.mode == 'install-open') && '["android11","android17"]' || inputs.mode == 'service-callback-new' && '["android17"]' || inputs.mode == 'service-callback' && '["android15","android17"]' || inputs.mode != 'runtime' && '["android15"]' || '["android11","experimental16k"]') }}
    env:
      RUNTIME_PROFILE: ${{ matrix.profile }}
      ANDROID_IMAGE: ${{ matrix.profile == 'android17' && 'system-images;android-37.0;google_apis;x86_64' || matrix.profile == 'android15' && 'system-images;android-35;google_apis;x86_64' || matrix.profile == 'android11' && 'system-images;android-30;google_apis;x86_64' || 'system-images;android-35;google_apis_ps16k;x86_64' }}
      RUNTIME_MODE: ${{ inputs.mode == 'permissions-legacy' && 'permissions' || inputs.mode == 'install-open-legacy' && 'install-open' || (inputs.mode == 'service-callback-new' || inputs.mode == 'service-cache') && 'service-callback' || inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare isolated Android environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-output
          trap 'printf "Environment setup failed at line %s\n" "$LINENO" > runtime-output/setup-error.txt' ERR
          test -e /dev/kvm
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          sdk_bin="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ ! -x "$sdk_bin/sdkmanager" ]; then
            for sdk_candidate in "$ANDROID_HOME"/cmdline-tools/*/bin; do
              if [ -x "$sdk_candidate/sdkmanager" ]; then sdk_bin="$sdk_candidate"; fi
            done
          fi
          test -x "$sdk_bin/sdkmanager"
          # Older runner tools silently write target=android-0 for dotted API versions.
          # Pin a parser that supports major.minor and call its binaries explicitly.
          if [ "$RUNTIME_PROFILE" = android17 ]; then
            "$sdk_bin/sdkmanager" --install 'cmdline-tools;20.0'
            sdk_bin="$ANDROID_HOME/cmdline-tools/20.0/bin"
            test -x "$sdk_bin/avdmanager"
          fi
          export PATH="$sdk_bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          printf '%s\n' "$sdk_bin" "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/bybus-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          sdkmanager --install emulator "$ANDROID_IMAGE"
          printf 'no\n' | avdmanager create avd -n bybus-runtime -k "$ANDROID_IMAGE"
          expected_target=$(cut -d ';' -f 2 <<< "$ANDROID_IMAGE")
          grep -Fx "target=$expected_target" "$ANDROID_AVD_HOME/bybus-runtime.ini" > runtime-output/avd-target.txt
          printf '\nhw.lcd.width=720\nhw.lcd.height=1560\nhw.lcd.density=320\ndisk.dataPartition.size=4G\n' >> "$ANDROID_AVD_HOME/bybus-runtime.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -accel-check > runtime-output/acceleration.txt
          graphics_mode=swiftshader_indirect
          if [ "$RUNTIME_PROFILE" = android17 ]; then graphics_mode=software; fi
          "$ANDROID_HOME/emulator/emulator" -avd bybus-runtime -accel on -memory 3072 -cores 2 -no-window -no-audio -no-snapshot -no-boot-anim -gpu "$graphics_mode" -camera-back none -camera-front none > "$RUNNER_TEMP/bybus-emulator.log" 2>&1 &
      - name: Inspect the published APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNTIME_CANDIDATE: ${{ inputs.candidate }}
        run: python3 scripts/cloud-runtime.py
      - name: Save runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bybus-runtime-${{ matrix.profile }}
          path: runtime-output/
          retention-days: 1
          if-no-files-found: error
