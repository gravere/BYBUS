name: Public repository files

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify public files
        run: python3 scripts/check-public-tree.py --revision HEAD
      - name: Verify publication checks
        run: python3 -m unittest discover -s scripts -p test_public_tree.py
