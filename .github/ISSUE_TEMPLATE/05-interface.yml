name: 手机与平板界面
description: BYBUS 按钮、弹窗、返回手势、系统导航条、横竖屏或大字号显示
title: '[界面] '
labels:
- bug
body:
- type: markdown
  attributes:
    value: 这个入口反馈 BYBUS 本身的界面；游戏内的文字问题请选“汉化与文字显示”。
- type: input
  id: page
  attributes:
    label: BYBUS 的哪个页面？
    placeholder: 例如：设置与工具 → 应用更新 → 下载进度
  validations:
    required: true
- type: textarea
  id: interaction
  attributes:
    label: 怎样操作，哪里不对？
    placeholder: 例如：横屏后按钮被系统导航条挡住，无法点击。
    description: 说明实际显示 / 动作与希望的结果。
  validations:
    required: true
- type: input
  id: app-version
  attributes:
    label: BYBUS 版本
    description: 关于页中查看；无法查看可直接说明。
  validations:
    required: true
- type: input
  id: device
  attributes:
    label: 设备与系统
    placeholder: 手机或平板型号 / Android 版本 / OriginOS、HyperOS 等系统版本
    description: 填写机型、Android 版本和系统名称；不知道的部分可留空。
  validations:
    required: true
- type: dropdown
  id: display
  attributes:
    label: 当时的显示方式（选填，可多选）
    multiple: true
    options:
    - 手机竖屏
    - 手机横屏
    - 平板竖屏
    - 平板横屏
    - 分屏 / 小窗
    - 系统三键导航
    - 系统手势导航
    - 系统字体或显示大小已调大
  validations:
    required: false
- type: textarea
  id: evidence
  attributes:
    label: 截图或诊断包（选填）
    description: 可拖入截图、录屏或“设置与工具 → 导出诊断”生成的 ZIP；无法获取可留空。附件请遮住邮箱、账号及付款信息。
  validations:
    required: false
